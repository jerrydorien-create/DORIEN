name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: $HOME/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: $HOME/.buildozer/android/platform/android-sdk
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev wget

      - name: Preparar o Android SDK no local esperado pelo Buildozer
        run: |
          export SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK"
          cd "$SDK"

          if [ ! -f "$SDK/tools/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
            unzip -q tools.zip
            mkdir -p "$SDK/cmdline-tools"
            if [ -d "$SDK/cmdline-tools" ] && [ ! -d "$SDK/cmdline-tools/latest" ]; then
              mv cmdline-tools "$SDK/cmdline-tools/latest"
            fi
          fi

          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"
          ln -sf "$SDK/cmdline-tools/latest/bin/adb" "$SDK/tools/bin/adb"

          yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Gerar o APK
        run: buildozer android debug

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cnc-simulator-apk
          path: bin/*.apk
